<tr id="reg-{{ r.id }}" class="border-t">
  {% for f in ['name_en','name_hi','institution','grade','mobile'] %}
  <td class="p-1"><input name="value" value="{{ r[f] }}" lang="{{ 'hi' if f=='name_hi' else 'en' }}" class="w-full min-w-[7rem] border border-transparent hover:border-slate-300 focus:border-blue-500 rounded px-2 py-1 bg-transparent"
      hx-post="/admin/regs/{{ r.id }}/edit?field={{ f }}" hx-trigger="change" hx-swap="none"
      hx-on::response-error="alert(event.detail.xhr.responseText); event.target.style.background='#fee2e2'"
      hx-on::after-request="if(event.detail.successful) event.target.style.background='#dcfce7'"></td>
  {% endfor %}
  <td class="p-1 text-center"><button class="text-xs px-2 py-1 rounded {{ 'bg-emerald-100 text-emerald-800' if r.approved else 'bg-slate-100' }}" hx-post="/admin/regs/{{ r.id }}/toggle/approved" hx-target="#reg-{{ r.id }}" hx-swap="outerHTML">{{ 'Approved' if r.approved else 'Approve' }}</button></td>
  <td class="p-1 text-center"><button class="text-xs px-2 py-1 rounded {{ 'bg-emerald-100 text-emerald-800' if r.status=='present' else 'bg-slate-100' }}" hx-post="/admin/regs/{{ r.id }}/toggle/present" hx-target="#reg-{{ r.id }}" hx-swap="outerHTML">{{ 'Present' if r.status=='present' else 'Mark present' }}</button></td>
  <td class="p-1 text-xs">{% if cert %}<a class="text-blue-700 underline font-mono" href="/certificate/{{ cert.cert_id }}" target="_blank">{{ cert.cert_id }}</a>
    <form method="post" action="/admin/certs/{{ cert.cert_id }}/revoke" class="inline"><button class="text-slate-400 hover:text-red-600">{{ 'restore' if cert.revoked else 'revoke' }}</button></form>{% else %}—{% endif %}</td>
  <td class="p-1 text-xs"><a class="underline" href="/pass/{{ r.token }}" target="_blank">{{ r.token }}</a> · {{ r.attend_mode }}</td>
</tr>
