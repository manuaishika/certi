{% extends "base.html" %}
{% block title %}Login | CerGeMA{% endblock %}
{% block content %}
<form method="post" action="/login" class="max-w-sm mx-auto bg-white border rounded-2xl p-6 mt-8">
  <h1 class="text-xl font-bold">Organiser login</h1>
  {% if error %}<p class="mt-2 text-sm text-red-700">{{ error }}</p>{% endif %}
  <label class="block mt-4 text-sm">Email<input name="email" type="email" required class="mt-1 w-full border rounded-lg px-3 py-2"></label>
  <label class="block mt-3 text-sm">Password<input name="password" type="password" required class="mt-1 w-full border rounded-lg px-3 py-2"></label>
  <button class="mt-5 w-full rounded-lg bg-brand text-white py-2 font-semibold">Sign in</button>
  <p class="text-xs text-slate-500 mt-4">Demo: <code>demo@cergema.local</code> / <code>demo123</code></p>
</form>
{% endblock %}
