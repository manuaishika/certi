name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test                 # SQL migrations / RLS / RPCs on Postgres (PGlite) + edge helper logic
      - run: npm run check:edge       # deno type-check every Edge Function
      - run: npm run test:edge        # webhook / ERP API / outbox handlers under Deno
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
